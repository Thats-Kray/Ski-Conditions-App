<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- iOS home screen behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PowderDays" />

    <title>PowderDays — Plan Your Ski Season With Your Crew</title>
    <meta name="description" content="The social home base for your ski season. Add friends, plan trips together, track your days, and use 10 years of snowfall data to pick the right week. 90+ resorts worldwide." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://powderdays.app/" />
    <meta property="og:title" content="PowderDays — Plan Your Ski Season With Your Crew" />
    <meta property="og:description" content="The social home base for your ski season. Add friends, plan trips together, track your days, and use 10 years of snowfall data to pick the right week." />
    <meta property="og:image" content="https://powderdays.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PowderDays — Plan Your Ski Season With Your Crew" />
    <meta name="twitter:description" content="Add friends, plan trips together, track your season, and use a decade of snowfall data to pick the right week." />
    <meta name="twitter:image" content="https://powderdays.app/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#020617" />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem("pd_theme")
        if (t) document.documentElement.setAttribute("data-theme", t)
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .catch(function(err) { console.warn('SW registration failed:', err) })
        })
      }
    </script>
  </body>
</html>
